<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
  <h1>Productos</h1>
  <a th:href="@{/}">Inicio</a>

  <table>
    <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
    <tr th:each="p : ${productos}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.nombre}"></td>
      <td th:text="${p.precio}"></td>
      <td th:text="${p.stock}"></td>
      <td>
        <a th:href="@{'/productos/eliminar/' + ${p.id}}">Eliminar</a> |
        <a th:href="@{'/productos/editar/' + ${p.id}}">Editar</a>
      </td>
    </tr>
  </table>

  <h3>Agregar / Editar producto</h3>
  <form th:action="@{/productos/guardar}" th:object="${productoForm}" method="post">
    <input type="hidden" th:field="*{id}" />
    Nombre: <input type="text" th:field="*{nombre}" /> <br/>
    Precio: <input type="number" step="0.01" th:field="*{precio}" /> <br/>
    Stock: <input type="number" th:field="*{stock}" /> <br/>
    <button type="submit">Guardar</button>
  </form>

</body>
</html>
