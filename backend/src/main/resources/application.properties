# Servidor (Lee la variable SERVER_PORT, si no existe usa 8080 localmente)
server.port=${SERVER_PORT:8080}

# Origenes autorizados para llamar a /api/**, incluyendo tu dominio de desarrollo actual
pos.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201,https://equipo-2-elev-n-dev.apolobyte.online}

# Base de datos PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/posb}
spring.datasource.username=${DB_USER:posb}
spring.datasource.password=${DB_PASSWORD:12345}

# Configuraciones de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuraciones de desarrollo
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true