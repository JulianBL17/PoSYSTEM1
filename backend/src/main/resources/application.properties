# Servidor
server.port=8080

# Origenes (Angular en modo desarrollo) autorizados para llamar a /api/**, separados por coma.
# En Docker no hace falta: nginx reenvia /api al backend desde el mismo origen.
pos.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

spring.datasource.url=jdbc:postgresql://localhost:5433/posb

spring.datasource.username=posb

spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true

spring.devtools.livereload.enabled=true