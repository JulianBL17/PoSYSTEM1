services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posb
      POSTGRES_USER: posb
      POSTGRES_PASSWORD: "12345"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posb -d posb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      # Enlazado explícito a 127.0.0.1 para que Nginx lo alcance correctamente en el puerto 8081
      - "127.0.0.1:${SERVER_PORT:-8081}:8080"

  frontend:
    build: ./fronted
    depends_on:
      - backend
    ports:
      # Enlazado explícito a 127.0.0.1 para el entorno dev (puerto 4201) o main
      - "127.0.0.1:${FRONTEND_PORT:-4201}:80"

volumes:
  pgdata: