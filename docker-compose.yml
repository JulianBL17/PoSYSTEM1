services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posb
      POSTGRES_USER: posb
      POSTGRES_PASSWORD: "12345"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posb -d posb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/posb
      SPRING_DATASOURCE_USERNAME: posb
      SPRING_DATASOURCE_PASSWORD: "12345"
    ports:
      # CAMBIO CLAVE: Puerto abierto y enlazado a la variable del VPS
      - "${SERVER_PORT:-8081}:8080"

  frontend:
    build: ./fronted
    depends_on:
      - backend
    ports:
      # CAMBIO CLAVE: Usa la variable FRONTEND_PORT. Si no existe, usa 4200 por defecto.
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pgdata: