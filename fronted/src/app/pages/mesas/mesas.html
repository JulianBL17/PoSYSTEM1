<div class="container-fluid pos-page px-3 px-lg-4 py-4">

  <!-- ENCABEZADO -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
    <div>
      <h2 class="fw-bold">
        <i class="bi bi-grid-3x3-gap me-2"></i>
        Gestión de Mesas
      </h2>
      <p class="text-muted mb-0">
        Control de ubicaciones y asignación de pedidos
      </p>
    </div>
    
    <div class="d-flex gap-2">
      <span class="badge bg-success d-flex align-items-center"><i class="bi bi-circle-fill me-1 small"></i> Libre</span>
      <span class="badge bg-danger d-flex align-items-center"><i class="bi bi-circle-fill me-1 small"></i> Ocupada</span>
      <span class="badge text-dark bg-warning d-flex align-items-center"><i class="bi bi-circle-fill me-1 small"></i> Limpieza</span>
    </div>
  </div>

  <div class="row">
    <!-- GRID DE MESAS -->
    <div class="col-lg-8 col-xl-9 mb-4">
      <div class="grid-mesas">
        <div *ngFor="let mesa of mesas" 
             class="card mesa-card text-center text-white fw-bold shadow-sm border-0"
             [ngClass]="{
               'bg-success': mesa.estado === 'LIBRE',
               'bg-danger': mesa.estado === 'OCUPADA',
               'bg-warning text-dark': mesa.estado === 'LIMPIEZA',
               'mesa-seleccionada': mesaSeleccionada?.id === mesa.id
             }"
             (click)="seleccionarMesa(mesa)">
          <div class="card-body d-flex flex-column justify-content-center">
            <h5 class="mb-1 fw-bold">{{ mesa.numero }}</h5>
            <small class="opacity-75"><i class="bi bi-people-fill me-1"></i>x{{ mesa.capacidad }}</small>
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL LATERAL (Detalle de Mesa Seleccionada) -->
    <div class="col-lg-4 col-xl-3" *ngIf="mesaSeleccionada">
      <div class="card shadow-sm border-0 sticky-top" style="top: 20px;">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <h5 class="mb-0 fw-bold">{{ mesaSeleccionada.numero }}</h5>
          <button type="button" class="btn-close btn-close-white" (click)="cerrarDetalle()"></button>
        </div>
        
        <div class="card-body">
          <div class="mb-3 d-flex justify-content-between align-items-center">
            <span class="text-muted fw-semibold">Estado actual:</span>
            <span class="badge fs-6" 
                  [ngClass]="{
                    'bg-success': mesaSeleccionada.estado === 'LIBRE',
                    'bg-danger': mesaSeleccionada.estado === 'OCUPADA',
                    'bg-warning text-dark': mesaSeleccionada.estado === 'LIMPIEZA'
                  }">
              {{ mesaSeleccionada.estado }}
            </span>
          </div>

          <div class="mb-4 d-flex justify-content-between align-items-center" *ngIf="mesaSeleccionada.estado === 'OCUPADA'">
            <span class="text-muted fw-semibold">Total Consumo:</span>
            <span class="fs-5 fw-bold">$ {{ mesaSeleccionada.totalConsumo | number:'1.0-0' }}</span>
          </div>

          <hr>

          <h6 class="fw-bold mb-3">Acciones rápidas</h6>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-success text-start" *ngIf="mesaSeleccionada.estado !== 'LIBRE'" (click)="cambiarEstado('LIBRE')">
              <i class="bi bi-check-circle me-2"></i> Marcar como Libre
            </button>
            <button class="btn btn-outline-danger text-start" *ngIf="mesaSeleccionada.estado !== 'OCUPADA'" (click)="cambiarEstado('OCUPADA')">
              <i class="bi bi-cart-plus me-2"></i> Abrir Cuenta (Ocupar)
            </button>
            <button class="btn btn-outline-warning text-start" *ngIf="mesaSeleccionada.estado !== 'LIMPIEZA'" (click)="cambiarEstado('LIMPIEZA')">
              <i class="bi bi-stars me-2"></i> Solicitar Limpieza
            </button>
            <button class="btn btn-primary text-start mt-2" *ngIf="mesaSeleccionada.estado === 'OCUPADA'" routerLink="/ventas">
              <i class="bi bi-receipt me-2"></i> Ir a Facturación
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
